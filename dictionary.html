<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-title" content="English Practice">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <title>Dictionary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e8e8e8;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.5rem 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      padding: 0.5rem 0.85rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: rgba(232, 232, 232, 0.9);
      text-decoration: none;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
    }
    .header h1 { font-size: 1.45rem; }
    .wrap { max-width: 920px; margin: 0 auto; padding: 1.25rem 1rem 2rem; }
    .add-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }
    input, select, button {
      font-family: inherit;
      font-size: 0.92rem;
      color: #e8e8e8;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      padding: 0.58rem 0.7rem;
    }
    button { cursor: pointer; font-weight: 600; }
    .btn-primary {
      color: #1a1a2e;
      border: none;
      background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
    }
    .list { display: flex; flex-direction: column; gap: 0.55rem; }
    .item {
      padding: 0.8rem 0.9rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
    }
    .item-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
    }
    .item-text { font-weight: 600; word-break: break-word; }
    .item-meta { opacity: 0.72; font-size: 0.8rem; margin-top: 0.3rem; }
    .item-actions { display: flex; gap: 0.45rem; }
    .btn-sm { padding: 0.38rem 0.55rem; font-size: 0.8rem; }
    .empty { opacity: 0.72; padding: 0.5rem 0.2rem; }
    @media (max-width: 720px) {
      .add-row, .controls { grid-template-columns: 1fr; }
      .header { padding: 1rem; }
      .wrap { padding: 1rem 0.8rem 1.4rem; }
      .item-head { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="index.html" class="btn-back">← Menu</a>
    <h1>Dictionary</h1>
  </header>
  <main class="wrap">
    <div class="add-row">
      <input id="addInput" type="text" placeholder="Add a word, phrase, or sentence...">
      <select id="addList">
        <option value="it">IT</option>
        <option value="general" selected>General</option>
      </select>
      <button id="btnAdd" class="btn-primary">Add</button>
    </div>
    <div class="controls">
      <input id="searchInput" type="search" placeholder="Search..." autocomplete="off">
      <select id="listFilter" aria-label="List filter">
        <option value="it">IT</option>
        <option value="general" selected>General</option>
      </select>
      <select id="statusFilter" aria-label="Status filter">
        <option value="learning" selected>Learning</option>
        <option value="learned">Learned</option>
      </select>
    </div>
    <div class="list" id="dictList"></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics-compat.js"></script>
  <script src="dictionary-firebase.js"></script>
  <script>
    (function () {
      var STORAGE_KEY = 'hr-interview-examples';
      var addInput = document.getElementById('addInput');
      var addList = document.getElementById('addList');
      var btnAdd = document.getElementById('btnAdd');
      var searchInput = document.getElementById('searchInput');
      var listFilter = document.getElementById('listFilter');
      var statusFilter = document.getElementById('statusFilter');
      var dictList = document.getElementById('dictList');

      function getDictionary() {
        if (typeof DictionaryFirebase !== 'undefined' && DictionaryFirebase.getDictionary) {
          return DictionaryFirebase.getDictionary();
        }
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          var list = raw ? JSON.parse(raw) : [];
          return Array.isArray(list) ? list : [];
        } catch (_) { return []; }
      }

      function saveDictionary(list) {
        if (typeof DictionaryFirebase !== 'undefined' && DictionaryFirebase.saveDictionary) {
          DictionaryFirebase.saveDictionary(list);
          return;
        }
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (_) {}
      }

      function escapeHtml(s) {
        return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
      }

      function formatDate(iso) {
        if (!iso) return 'Not practiced yet';
        var d = new Date(iso);
        if (isNaN(d.getTime())) return 'Not practiced yet';
        return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      }

      function render() {
        var q = (searchInput.value || '').trim().toLowerCase();
        var wl = listFilter.value === 'it' ? 'it' : 'general';
        var learned = statusFilter.value === 'learned';
        var items = getDictionary().filter(function (item) {
          var itemList = item && item.wordList === 'it' ? 'it' : 'general';
          if (itemList !== wl) return false;
          if (!!item.learned !== learned) return false;
          if (!q) return true;
          return String(item.text || '').toLowerCase().indexOf(q) !== -1;
        });

        if (!items.length) {
          dictList.innerHTML = '<div class="empty">No words found for current filters.</div>';
          return;
        }

        dictList.innerHTML = items.map(function (item) {
          var id = String(item.id);
          return (
            '<div class="item" data-id="' + escapeHtml(id) + '">' +
              '<div class="item-head">' +
                '<div><div class="item-text">' + escapeHtml(item.text) + '</div><div class="item-meta">Last practiced: ' + escapeHtml(formatDate(item.lastPracticed)) + '</div></div>' +
                '<div class="item-actions">' +
                  '<button class="btn-sm" data-act="toggle">' + (item.learned ? 'Set learning' : 'Set learned') + '</button>' +
                  '<button class="btn-sm" data-act="delete">Delete</button>' +
                '</div>' +
              '</div>' +
            '</div>'
          );
        }).join('');
      }

      function addWord() {
        var text = (addInput.value || '').trim();
        if (!text) return;
        var list = getDictionary();
        var exists = list.some(function (x) { return String(x.text || '').toLowerCase() === text.toLowerCase(); });
        if (exists) return;
        list.unshift({
          id: Date.now(),
          text: text,
          wordList: addList.value === 'it' ? 'it' : 'general',
          createdAt: new Date().toISOString(),
          learned: false,
          translationRu: [],
          examplesEn: [],
          detailsReady: false
        });
        saveDictionary(list);
        addInput.value = '';
        render();
      }

      btnAdd.addEventListener('click', addWord);
      addInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') addWord(); });
      searchInput.addEventListener('input', render);
      listFilter.addEventListener('change', render);
      statusFilter.addEventListener('change', render);

      dictList.addEventListener('click', function (e) {
        var btn = e.target && e.target.closest ? e.target.closest('button[data-act]') : null;
        if (!btn) return;
        var card = btn.closest('.item');
        if (!card) return;
        var id = Number(card.getAttribute('data-id'));
        var list = getDictionary();
        var item = list.find(function (x) { return Number(x.id) === id; });
        if (!item) return;
        if (btn.getAttribute('data-act') === 'toggle') {
          item.learned = !item.learned;
          saveDictionary(list);
          render();
          return;
        }
        if (btn.getAttribute('data-act') === 'delete') {
          saveDictionary(list.filter(function (x) { return Number(x.id) !== id; }));
          render();
        }
      });

      if (typeof DictionaryFirebase !== 'undefined' && DictionaryFirebase.onDictionaryUpdate) {
        DictionaryFirebase.onDictionaryUpdate(render);
      }
      if (typeof DictionaryFirebase !== 'undefined' && DictionaryFirebase.onAuthUiChange) {
        DictionaryFirebase.onAuthUiChange(render);
      }
      render();
    })();
  </script>
</body>
</html>
